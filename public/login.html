<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OASIS — Connexion</title>
  <link rel="stylesheet" href="/shared/css/oasis-shell.css">
  <link rel="icon" type="image/svg+xml" href="/img/oasis-logo.svg">
  <!-- Le fond est déclaré dans une feuille : sans ceci, il n'est demandé
       qu'une fois le CSS lu, et la page s'ouvre sur un aplat avant de changer
       sous l'œil de l'agent. 55 Ko. -->
  <link rel="preload" as="image" href="/img/connexion-aire-de-trafic.webp">
  <link rel="stylesheet" href="/css/oasis.css">
  <!-- Retour d'action : panneau commun au portail et aux modules. -->
  <link rel="stylesheet" href="/shared/css/oasis-toast.css">
  <!-- Témoins de connexion : bandeau d'information à la première visite. -->
  <link rel="stylesheet" href="/shared/css/oasis-cookies.css">
  <script src="/shared/js/oasis-toast.js"></script>
</head>
<body>
  <div class="login-page">
    <!-- Décor : une aire de trafic à l'aube — un inspecteur, sa tablette, un
         appareil au départ. Il ne porte aucune information, et les silhouettes
         dessinées qui l'ont précédé s'effacent : la photo montre déjà des
         appareils, deux de plus en vecteur n'auraient été que du bruit. La
         couche du dessous reste le dégradé de la palette, qui teinte la photo
         et sert de fond si elle n'arrive pas. -->
    <div class="login-photo" aria-hidden="true"></div>
    <div class="login-voile" aria-hidden="true"></div>

    <main class="login-card">
      <div class="login-head">
        <span class="oasis-logo-img login-logo" role="img" aria-label="OASIS"></span>
        <h1 class="login-brand">OASIS<span class="oasis-pessco">pessco</span></h1>
        <!-- Deux lignes, et non un repli laissé au navigateur : la coupure est
             choisie dans chaque langue pour ne pas séparer un groupe de mots.
             Le portail, lui, garde la phrase d'un seul tenant — d'où deux clés
             propres à cette page plutôt qu'un saut dans `tagline`. -->
        <p class="login-tagline">
          <span data-i18n="tagline_l1">Outils d'Administration et de</span>
          <span data-i18n="tagline_l2">Supervision Intégrée de la Sécurité</span>
        </p>
      </div>

      <!-- Le message d'erreur est annoncé : sans role, un lecteur d'écran ne
           voit rien se passer quand la connexion échoue. -->
      <div class="login-error" id="loginError" role="alert"></div>

      <form id="loginForm">
        <div class="shell-form-group login-group">
          <label for="username" data-i18n="login_user">Email</label>
          <div class="login-field">
            <svg class="login-field-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3 7 9 6 9-6"/>
            </svg>
            <input class="shell-input" type="email" id="username" autocomplete="username" required autofocus>
          </div>
        </div>
        <div class="shell-form-group login-group">
          <label for="password" data-i18n="login_pass">Mot de passe</label>
          <div class="login-field">
            <svg class="login-field-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
            </svg>
            <input class="shell-input" type="password" id="password" autocomplete="current-password" required>
            <!-- Le nom accessible est repris à chaque changement de langue et à
                 chaque bascule : il dit ce que le clic va faire, pas l'état. -->
            <button type="button" class="login-oeil" id="voirMdp" aria-pressed="false" aria-label="Afficher le mot de passe">
              <svg class="oeil-ouvert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/>
              </svg>
              <svg class="oeil-barre" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M2 12s3.8-6.5 10-6.5c2 0 3.7.7 5.1 1.6M22 12s-3.8 6.5-10 6.5c-2 0-3.7-.7-5.1-1.6"/><path d="M3 3l18 18"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="shell-btn shell-btn-primary login-submit" data-i18n="login_btn">Se connecter</button>
      </form>

      <!-- Étape 2 : authentification multifacteur -->
      <form id="mfaForm" class="login-etape-cachee">
        <p class="mfa-intro"><span data-i18n="mfa_intro">Un code de vérification à 6 chiffres vient d'être envoyé à</span>
          <strong id="mfaTarget"></strong>. <span data-i18n="mfa_valable">Il est valable</span>
          <span id="mfaTtl">10</span> <span data-i18n="mfa_minutes">minutes.</span></p>
        <div class="shell-form-group login-group">
          <label for="mfaCode" data-i18n="mfa_code">Code de vérification</label>
          <input class="shell-input mfa-code" id="mfaCode" inputmode="numeric" autocomplete="one-time-code"
                 maxlength="6" pattern="[0-9]{6}" placeholder="••••••" required>
        </div>
        <button type="submit" class="shell-btn shell-btn-primary login-submit" data-i18n="mfa_verifier">Vérifier</button>
        <div class="mfa-actions">
          <select class="shell-input mfa-channel" id="mfaChannel" aria-label="Canal d'envoi du code"></select>
          <button type="button" class="shell-btn shell-btn-sm" id="mfaResend" data-i18n="mfa_renvoyer">Renvoyer le code</button>
        </div>
        <button type="button" class="mfa-back" id="mfaCancel" data-i18n="mfa_retour">← Revenir à la connexion</button>
      </form>

      <div class="login-footer-bar">
        <div class="portal-theme-selector">
          <div class="theme-dot" data-theme="blue-dark"    title="Bleu" data-i18n-title="palette_bleu"></div>
          <div class="theme-dot" data-theme="corporate"    title="Corporate" data-i18n-title="palette_corporate"></div>
          <div class="theme-dot" data-theme="retro-avionics" title="Retro-Avionics Jet" data-i18n-title="palette_gris"></div>
        </div>
        <div class="portal-lang-selector">
          <button class="lang-btn" data-lang="fr">FR</button>
          <button class="lang-btn" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="pt">PT</button>
        </div>
      </div>
      <!-- La mention complète est au portail et dans les modules ; ici la carte
           porte déjà le nom développé sous la marque, et ne le répète pas. -->
      <p class="login-copy">
        <a href="/cookies.html" data-i18n="cookies_titre">Témoins de connexion et données du navigateur</a>
        <span class="login-copy-droits">© 2026 UEMOA / URSAC</span>
      </p>
    </main>
  </div>

  <script src="/shared/app/oasis-theme.js"></script>
  <script src="/shared/js/oasis-requete.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/shared/js/oasis-cookies.js"></script>
  <script src="/js/login-page.js"></script>
</body>
</html>
