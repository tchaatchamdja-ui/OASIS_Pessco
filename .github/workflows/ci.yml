# Intégration continue OASIS : la suite de fumée à chaque poussée.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifier:
    name: Contrôles de fumée
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vulnérabilités des dépendances
        # Au niveau « high » : c'est à ce niveau qu'est sortie la faille de
        # nodemailer, qu'un seuil « critical » laissait passer.
        run: npm audit --omit=dev --audit-level=high

      - name: Syntaxe du serveur et des modules
        run: |
          for f in server.js src/*.js src/modules/*/*.js; do node --check "$f"; done

      - name: Suite de fumée
        # La suite « parcours » ouvre les écrans dans Chromium, celui que
        # Puppeteer installe avec les dépendances : rien à télécharger de plus.
        run: npm run smoke

  base:
    name: La campagne servie depuis PostgreSQL (ADR-001, ADR-002)
    runs-on: ubuntu-latest
    # ── Pourquoi cette tâche existe ──
    #
    # ADR-002 jalon n° 13 déclare la bascule du magasin complète : treize
    # collections et deux journaux chaînés vivent en PostgreSQL, et le même code
    # sert les fichiers quand aucune adresse n'est donnée. ADR-001 suite n° 3
    # demandait d'éprouver ce magasin contre un vrai serveur.
    #
    # C'était fait — une fois, à la main, le 1ᵉʳ octobre 2026 — et **rien ne le
    # rejouait**. La campagne par défaut rend 5 des 17 contrôles du magasin : les
    # douze qui interrogent un vrai moteur se déclarent hors de portée faute de
    # `OASIS_PG_ESSAI`, et aucune des treize suites ne sert la base faute de
    # `DATABASE_URL`. Un jalon clos sur une épreuve que personne ne rejoue n'est
    # pas clos : un `json` devenu `jsonb`, un `rev` mal comparé, une chaîne
    # d'audit qui forche — rien ne l'aurait dit.
    #
    # La tâche est séparée de `verifier` à dessein : la campagne sur fichiers est
    # le régime de production d'aujourd'hui et doit rester verte pour elle-même.
    # Les deux régimes se vérifient, pas l'un à la place de l'autre.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: essai
        ports: ['5432:5432']
        # Sans cette attente, la première suite trouve un serveur qui n'écoute
        # pas encore et la tâche échoue pour une raison qui n'est pas la bonne.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Créer la base de recette
        # Une base à elle, jamais `postgres` : la campagne écrit, et le relevé
        # de `tests/smoke/index.js` refuse toute écriture hors des schémas qu'il
        # s'est donnés.
        run: |
          PGPASSWORD=essai psql -h localhost -U postgres -c 'CREATE DATABASE oasis_recette'

      - name: Les 12 contrôles du magasin contre un vrai serveur
        # `OASIS_PG_ESSAI` est distincte de `DATABASE_URL` à dessein : cette
        # suite écrit, et on ne veut pas qu'une adresse posée pour autre chose
        # la dirige sur une base qui compte. Elle travaille dans son schéma.
        env:
          OASIS_PG_ESSAI: postgres://postgres:essai@localhost:5432/oasis_recette
        run: npm run smoke -- magasin-pg

      - name: La campagne entière, servie depuis PostgreSQL
        # C'est l'épreuve du jalon n° 13 : les 386 routes, les quinze
        # collections, les deux journaux chaînés — le même code, l'autre régime.
        # Chaque suite reçoit son propre schéma, repris depuis les fixtures, et
        # détruit à l'arrêt.
        env:
          DATABASE_URL: postgres://postgres:essai@localhost:5432/oasis_recette
        run: npm run smoke

  contrats:
    name: Contrats d'octets (ADR-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Les vecteurs sont produits depuis l'implémentation Node : on vérifie
      # d'abord qu'ils n'ont pas dérivé sous elle.
      - name: Vecteurs à jour avec Node
        run: node scripts/vecteurs-conformite.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Puis que Java les satisfait. Sans ce travail, la réécriture d'ADR-002
      # perdrait les mots de passe existants ou romprait la chaîne d'audit —
      # deux pannes qui ne lèvent aucune exception.
      - name: Java satisfait les contrats
        working-directory: conformite-java
        run: mvn -B test

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: [verifier, contrats]
    steps:
      - uses: actions/checkout@v4
      - name: Construire
        run: docker build -t oasis:${{ github.sha }} .

      # Ce que « l'image se construit » ne dit pas : qu'elle sert quelque chose.
      #
      # Les écrans en React + TypeScript (ADR-003) se construisent, et leur paquet
      # n'est pas versionné. Une image qui ne le produit pas démarre, répond 200
      # sur `/api/health`, répond 200 sur la page de l'écran — et sert un écran
      # blanc. Mesuré : en retirant la seule ligne qui copie le paquet, les trois
      # vérifications évidentes restent vertes et seul le paquet manque.
      #
      # On démarre donc l'image et on demande le paquet. `--fail` est ce qui fait
      # mordre : sans lui, `curl` rend 0 sur un 404.
      - name: Éprouver que l'image sert les écrans construits
        run: |
          docker run -d --name epreuve -p 4750:4750 \
            -e OASIS_VERROU=0 -e OASIS_SEED_PASSWORD=epreuve-ci-seulement \
            oasis:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -sf http://localhost:4750/api/health >/dev/null && break
            sleep 2
          done
          # La liste se **déduit du dépôt**, elle ne s'écrit pas : un écran ajouté
          # à `frontend/`, un fichier du socle converti dans
          # `frontend/socle/globales/`, et ce contrôle les couvre sans qu'on y
          # pense. Une liste écrite ici aurait dérivé — c'est exactement la
          # dérive qui avait laissé trois chemins de déploiement faux.
          paquets=$(
            ls -d frontend/*/main.tsx 2>/dev/null | sed 's#^frontend/#/modules/#; s#/main\.tsx$#/app/main.js#'
            ls frontend/socle/globales/*.ts 2>/dev/null | sed 's#^.*/#/shared/app/#; s#\.ts$#.js#'
          )
          echo "paquets attendus :"; echo "$paquets"
          test -n "$paquets" || { echo "::error::aucun paquet attendu — le relevé est faux"; exit 1; }
          echec=0
          for paquet in $paquets; do
            if curl -sf -o /dev/null "http://localhost:4750$paquet"; then
              echo "::notice::$paquet servi"
            else
              echo "::error::$paquet absent de l'image : l'écran serait blanc"
              echec=1
            fi
          done
          docker logs epreuve | tail -30
          docker rm -f epreuve >/dev/null
          exit $echec
