# Intégration continue OASIS : la suite de fumée à chaque poussée.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verifier:
    name: Contrôles de fumée
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vulnérabilités des dépendances
        # Au niveau « high » : c'est à ce niveau qu'est sortie la faille de
        # nodemailer, qu'un seuil « critical » laissait passer.
        run: npm audit --omit=dev --audit-level=high

      - name: Syntaxe du serveur et des modules
        run: |
          for f in server.js src/*.js src/modules/*/*.js; do node --check "$f"; done

      - name: Suite de fumée
        # La suite « parcours » ouvre les écrans dans Chromium, celui que
        # Puppeteer installe avec les dépendances : rien à télécharger de plus.
        run: npm run smoke

  contrats:
    name: Contrats d'octets (ADR-002)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Les vecteurs sont produits depuis l'implémentation Node : on vérifie
      # d'abord qu'ils n'ont pas dérivé sous elle.
      - name: Vecteurs à jour avec Node
        run: node scripts/vecteurs-conformite.js

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Puis que Java les satisfait. Sans ce travail, la réécriture d'ADR-002
      # perdrait les mots de passe existants ou romprait la chaîne d'audit —
      # deux pannes qui ne lèvent aucune exception.
      - name: Java satisfait les contrats
        working-directory: conformite-java
        run: mvn -B test

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: [verifier, contrats]
    steps:
      - uses: actions/checkout@v4
      - name: Construire
        run: docker build -t oasis:${{ github.sha }} .
