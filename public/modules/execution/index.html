<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OASIS — Exécution de la Surveillance</title>
  <!-- Socle : mise en page, composants, chrome de module -->
  <link rel="stylesheet" href="/shared/css/oasis-module.css">
  <link rel="icon" type="image/svg+xml" href="/img/oasis-logo.svg">
  <link rel="stylesheet" href="/shared/css/oasis-shell.css">
  <!-- Styles propres au module (repris intégralement de PESSCO) -->
  <!-- Styles du module, dans l'ordre de cascade. -->
  <link rel="stylesheet" href="/modules/execution/css/exec-base.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-volets.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-tableaux.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-documents.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-composants.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-impression.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-processus.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-parametres.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-etats.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-suivi.css">
  <link rel="stylesheet" href="/modules/execution/css/exec-constatations.css">
  <style>
    html, body { height: 100%; margin: 0; }
    #app { height: 100%; }
  </style>
  <!-- Attente : l'aéronef en orbite autour du globe. -->
  <link rel="stylesheet" href="/shared/css/oasis-loader.css">
  <script src="/shared/app/oasis-loader.js"></script>
  <!-- Retour d'action : panneau commun au portail et aux modules. -->
  <link rel="stylesheet" href="/shared/css/oasis-toast.css">
  <!-- Filtres : bordure aux couleurs du thème, pour toute l'application. -->
  <link rel="stylesheet" href="/shared/css/oasis-filtres.css">
  <!-- Mode dégradé (TDR §F.2, fiche technique §2 n° 3) : le dossier se remplit
       sur site, chez l'organisme surveillé, où le réseau n'est pas acquis. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a365d">
  <link rel="stylesheet" href="/shared/css/oasis-hors-ligne.css">
  <script src="/shared/js/oasis-toast.js"></script>
  <script src="/shared/app/oasis-dates.js"></script>
  <!-- Les palettes : la liste, les noms, et la conversion d'une clé ancienne.
       Chargé avant l'amorçage ci-dessous, qui lit la préférence. -->
  <script src="/shared/app/oasis-theme.js"></script>
</head>
<body class="exec-module">
  <div id="app"><div data-oasis-loader>Chargement du module…</div></div>

  <script>
    // Pont OASIS → module PESSCO « Exécution de la Surveillance ».
    // Le module tourne en mode autonome (il rend sa propre coquille) ; le
    // contexte utilisateur vient du socle OASIS.
    window.EXEC_BOOT = (async function () {
      const res = await fetch('/api/m/execution/context', { credentials: 'same-origin' });
      if (res.status === 401) { parent.postMessage({ type: 'exec:unauthenticated' }, '*'); throw new Error('unauthenticated'); }
      // Module fermé au compte : la page ne se monte pas. Sans ce contrôle
      // elle s'ouvrait sur une coquille vide, où chaque geste échouait sans
      // qu'on sache pourquoi.
      const ctx = await res.json();
      if (res.status === 403) throw new Error(ctx.error || 'Ce module ne vous est pas ouvert. Veuillez contacter l’administrateur.');
      const u = ctx.user || {};
      const execUser = {
        id: u.username, username: u.username,
        nom: u.nom || u.username, prenom: u.prenom || '',
        email: u.email || u.username, role: u.role, role_m3: u.role_m3,
        prestataire_id: u.prestataire_id || '', domaines: u.domaines || [], photo: u.photo || '',
      };
      localStorage.setItem('pr_user', JSON.stringify(execUser));
      const theme = oasisThemeEnregistre();
      const lang = localStorage.getItem('pr_lang') || 'fr';
      document.documentElement.setAttribute('data-theme', theme);
      return { execUser, theme, lang, ctx };
    })();
  </script>

  <script src="/shared/js/oasis-requete.js"></script>
  <!-- Après oasis-requete.js, et jamais avant. -->
  <script src="/shared/js/oasis-hors-ligne.js"></script>
  <script src="/shared/app/oasis-messages-serveur.js"></script>
  <script src="/shared/js/oasis-commun.js"></script>
  <script src="/shared/app/oasis-kpi.js"></script>
  <script src="/modules/execution/js/exec-boot.js"></script>
  <!-- Écrans du module : chargés dans cet ordre, ils partagent la même portée. -->
  <!-- Le volet français seul. Les deux autres pèsent 131 Ko à eux deux, et un
       agent n'en emploie jamais qu'un : celui de sa langue se charge à la
       demande, avant le premier rendu (voir execVolet dans exec-i18n.js). -->
  <script src="/modules/execution/js/exec-i18n.js"></script>
  <script src="/modules/execution/js/exec-app.js"></script>
  <script src="/modules/execution/js/exec-dashboard.js"></script>
  <script src="/modules/execution/js/exec-plans.js"></script>
  <script src="/modules/execution/js/exec-notifications.js"></script>
  <script src="/modules/execution/js/exec-activites.js"></script>
  <script src="/modules/execution/js/exec-checklists-saisie.js"></script>
  <script src="/modules/execution/js/exec-dossier-actions.js"></script>
  <script src="/modules/execution/js/exec-prestataires.js"></script>
  <script src="/modules/execution/js/exec-constatations.js"></script>
  <script src="/modules/execution/js/exec-pac.js"></script>
  <script src="/modules/execution/js/exec-pac-suivi.js"></script>
  <script src="/modules/execution/js/exec-rapports.js"></script>
  <script src="/modules/execution/js/exec-utilisateurs.js"></script>
  <script src="/modules/execution/js/exec-parametres.js"></script>
  <script src="/modules/execution/js/exec-fiche.js"></script>
  <script src="/modules/execution/js/exec-processus.js"></script>
  <script src="/modules/execution/js/exec-processus-config.js"></script>
  <script src="/modules/execution/js/exec-etats.js"></script>
  <script src="/modules/execution/js/exec-adapters.js"></script>
  <script src="/modules/execution/js/exec-namespace.js"></script>
  <script>window.OASIS_MODULE_KEY = "execution"; window.OASIS_MODULE_RIGHTS = "SURV";</script>
  <script src="/shared/js/module-chrome.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const boot = await window.EXEC_BOOT;
        window.EXEC_STATE.user = boot.execUser;
        window.EXEC_STATE.theme = boot.theme;
        window.EXEC_STATE.lang = boot.lang;
        await execLoadData();
        await execEtatsChargerDelais();
        execRenderApp();
        execNavigateTo('dashboard');
        if (typeof execUpdateNotifBadge === 'function') execUpdateNotifBadge();
        const notify = () => parent.postMessage({ type: 'exec:page', page: window.EXEC_STATE.currentPage }, '*');
        notify();
        const origNav = window.execNavigateTo;
        window.execNavigateTo = function (p, s) { origNav(p, s); notify(); };
      } catch (e) {
        document.getElementById('app').innerHTML =
          oasisModuleIndisponible(e);
      }
    });
  </script>
</body>
</html>
