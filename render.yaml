# OASIS — description du service pour Render (Infrastructure as Code).
# Render lit ce fichier via un « Blueprint » : New → Blueprint → dépôt OASIS_Pessco.
#
# ⚠ Plan gratuit : le disque du service est éphémère. Les données (comptes,
# journal d'audit, dossiers) sont perdues à chaque redéploiement et à chaque
# réveil après mise en veille. Ce déploiement vaut pour la démonstration.
# Pour un usage réel : plan Starter + disque persistant, et OASIS_DATA_DIR
# pointé sur le point de montage (voir DEPLOYMENT.md).

services:
  - type: web
    name: oasis
    runtime: node
    plan: free
    region: frankfurt          # le plus proche de l'Afrique de l'Ouest
    # Branche déployée. Les travaux de la Phase 2 ont rejoint `main`, qui porte
    # désormais l'application entière ; le point de retour vers le socle Phase 1
    # est le tag `phase-1`, qu'une ligne `branch: phase-1` ramènerait en service.
    branch: main
    # Le rendu PDF des rapports transmis passe par Chromium (puppeteer).
    # Render vide node_modules entre les constructions mais conserve
    # XDG_CACHE_HOME : le navigateur y est téléchargé une fois, puis réutilisé.
    #
    # `--include=dev` n'est pas une précaution de style. `NODE_ENV` est posé à
    # `production` plus bas, et npm en tire la conclusion qu'il peut sauter les
    # dépendances de développement : la construction échouerait alors en annonçant
    # qu'esbuild est introuvable, loin de sa cause.
    #
    # `npm run build` produit les écrans en React + TypeScript (ADR-003). Leur
    # paquet n'est pas versionné — sans cette commande, le service démarre, répond
    # 200, et sert un écran blanc.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Active le cookie Secure, HSTS et le cache des fichiers statiques.
      - key: NODE_ENV
        value: production
      # Render place un proxy devant le service : sans cela, la limitation de
      # débit compterait toutes les requêtes sur une seule adresse.
      - key: OASIS_TRUST_PROXY
        value: "1"
      # Le proxy de Render compresse déjà : inutile de le faire deux fois.
      - key: OASIS_COMPRESSION
        value: "0"
      # Authentification multifacteur : requise en production. Le fichier de
      # configuration est cuit dans l'image et n'y est pas modifiable ; c'est
      # ici que la décision se pose.
      #
      # ⚠ ELLE EXIGE LES QUATRE VARIABLES SMTP CI-DESSOUS. Sans messagerie
      # joignable, le code à usage unique ne part nulle part et PERSONNE ne
      # peut se connecter. Le démarrage le signale, mais ne l'empêche pas.
      # Tant qu'elles ne sont pas renseignées, laisser OASIS_MFA à "0".
      - key: OASIS_MFA
        value: "0"
      # Messagerie. Le paramétrage du dépôt pointe sur le Mailpit d'un poste de
      # développement (localhost:1025) : sur un hébergement, seules ces
      # variables donnent un serveur joignable. À saisir dans le tableau de
      # bord (Environment) — l'hôte suffit à activer l'envoi.
      - key: OASIS_SMTP_HOST
        sync: false
      - key: OASIS_SMTP_PORT
        sync: false
      - key: OASIS_SMTP_USER
        sync: false
      - key: OASIS_SMTP_PASS
        sync: false
      # Chromium survit aux constructions : sans cela, il serait retéléchargé
      # à chaque déploiement — ou introuvable au démarrage.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      # Mot de passe des comptes créés à chaque démarrage à froid. À saisir
      # dans le tableau de bord Render (Environment) — il n'est pas dans le code.
      - key: OASIS_SEED_PASSWORD
        sync: false
